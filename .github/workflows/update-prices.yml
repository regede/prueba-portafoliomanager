name: Update Stock Prices

on:
  schedule:
    # Cada 15 min, lunes-viernes, 13:00-21:00 UTC (cubre NYSE 9:30am-4pm ET en EST y EDT)
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch: # Permite correr manualmente desde GitHub

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || \
            git commit -m "prices: $(date -u +'%Y-%m-%d %H:%M') UTC" && \
            git push
